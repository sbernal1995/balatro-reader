name: Tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path engine/Cargo.toml --workspace --release --locked
      - run: cargo build --manifest-path engine/Cargo.toml --release --locked
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_native_engine test_simulator test_reader -v
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: balatro-reader-engine-windows-x64
          path: engine/target/release/balatro-reader-engine.exe
