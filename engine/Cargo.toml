[package]
name = "balatro-reader-engine"
version = "0.6.0"
edition = "2021"

[workspace]
members = ["vendor/balatro-core"]

[dependencies]
balatro-core = { path = "vendor/balatro-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
